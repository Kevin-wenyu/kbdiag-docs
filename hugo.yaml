# Minimal English + Chinese profile. Copy this file to ../hugo.yaml to use it.
title: &siteTitle kbdiag
baseURL: https://Kevin-wenyu.github.io/kbdiag-docs/
defaultContentLanguage: en
disableLanguages: [fr]
enableGitInfo: true
enableRobotsTXT: true

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Inspect KingbaseES health, investigate SQL and locks, and follow diagnostic evidence.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 面向 KingbaseES 的命令行诊断工具集：日常巡检、SQL 与锁排查、主备检查和根因分析。
  # Keep French declared so Hugo recognizes .fr.md as a disabled translation.
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  github_repo: https://github.com/Kevin-wenyu/kbdiag-docs
  github_branch: main
  offline_search: true
  copyright:
    authors: kbdiag contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
