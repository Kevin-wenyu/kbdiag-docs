 "faq": {
  "title": "开始之前",
  "style": "flat",
  "items": [
   {
    "question": "数据库主机上要装什么？",
    "answer": "只要这一个二进制。它自己实现线协议，不需要 ksql 或任何运行时；以 kingbase OS 用户走本地 socket 连接即可。"
   },
   {
    "question": "它会改我的数据库吗？",
    "answer": "不会。每个连接都是只读事务并设了 lock_timeout。ROLLBACK PREPARED 之类的处理语句只打印出来让你判断，从不执行。"
   },
   {
    "question": "原来的 shell 版呢？",
    "answer": "kbdiag 2.0 是 Go 重写版，首个版本覆盖会话、锁、事务、等待、实例概况和复制槽。shell 版（v1.x）已冻结，需要它的其他命令请用 v1.0.0。"
   }
  ]
 },
