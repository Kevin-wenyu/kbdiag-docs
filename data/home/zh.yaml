  "faq": {
    "title": "开始前，了解这些边界",
    "style": "flat",
    "items": [
      {
        "question": "需要部署一个服务吗？",
        "answer": "工具以单文件脚本运行在数据库主机上，调用已有的 ksql 和系统工具。无需为 kbdiag 单独部署 Web 服务；集群相关能力按需使用 repmgr。"
      },
      {
        "question": "可以自动修复问题吗？",
        "answer": "诊断结果用于辅助判断。`advisor --fix` 生成 SQL，不直接执行；kill 会影响查询或会话；workload 在部分条件下会补建快照。各命令的操作边界见功能概览。"
      },
      {
        "question": "单机和主备都能使用吗？",
        "answer": "支持 KingbaseES V8R6+ 单机和 repmgr 主备环境。部分信息取决于当前节点角色、数据库权限和可选扩展；缺少数据不代表系统没有问题。"
      }
    ]
  },
