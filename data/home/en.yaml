  "faq": {
    "title": "Before you start",
    "style": "flat",
    "items": [
      {
        "question": "Do I need another service?",
        "answer": "The single-file script runs on the database host using ksql and system utilities. No separate kbdiag web service is required; cluster features use repmgr where available."
      },
      {
        "question": "Does it repair problems automatically?",
        "answer": "Findings support your judgment. `advisor --fix` emits SQL without executing it; kill affects queries or sessions; workload may create a snapshot in some conditions. See the capabilities page for details."
      },
      {
        "question": "Can I use it on standalone and HA instances?",
        "answer": "The documented target is KingbaseES V8R6+ on standalone or repmgr HA deployments. Available evidence depends on node role, database privileges and optional extensions; missing data does not prove health."
      }
    ]
  },
