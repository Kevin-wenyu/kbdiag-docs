 "faq": {
  "title": "Before you start",
  "style": "flat",
  "items": [
   {
    "question": "What do I need on the database host?",
    "answer": "Only the binary. It speaks the wire protocol itself, so it does not need ksql or any runtime; connect over the local socket as the kingbase OS user."
   },
   {
    "question": "Can it change my database?",
    "answer": "No. Every connection is a read-only transaction with a lock_timeout. Suggested fixes such as ROLLBACK PREPARED are printed for you to review, never executed."
   },
   {
    "question": "What about the old shell toolkit?",
    "answer": "kbdiag 2.0 is a Go rewrite; this first release covers sessions, locks, transactions, waits, instance status and replication slots. The shell toolkit (v1.x) is frozen; use release v1.0.0 if you need its other commands."
   }
  ]
 },
